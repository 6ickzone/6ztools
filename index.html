<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6ztools — Security Research Platform</title>
  <script>
    // Apply the saved theme (dark by default) before first paint so the landing
    // page never flashes light mode. Mirrors the key used by AppLayout.
    try {
      var t = localStorage.getItem("6ickzone-theme");
      document.documentElement.className = t === "light" ? "light" : "dark";
    } catch (e) {
      document.documentElement.className = "dark";
    }
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
